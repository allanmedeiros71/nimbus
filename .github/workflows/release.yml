# Publica uma versão nova quando uma tag vX.Y.Z é enviada:
# testes -> PyPI (nimbus-player) -> GitHub Release -> fórmula no tap do Homebrew.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Conferir tag x versão
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/nimbus/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com __version__ = $version"
            exit 1
          fi
      - name: Testes
        run: |
          sudo apt-get update && sudo apt-get install -y mpv
          pip install -e '.[dev]'
          pytest -q
      - name: Empacotar
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: sem token do PyPI guardado no repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: pypi
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - if: env.TAP_TOKEN == ''
        run: echo "::warning::Sem o segredo HOMEBREW_TAP_TOKEN; a fórmula do Homebrew não foi atualizada."
      - if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.TAP_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Esperar a versão aparecer no PyPI
        if: env.TAP_TOKEN != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          for i in $(seq 30); do
            curl -fsS "https://pypi.org/pypi/nimbus-player/$version/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Gerar a fórmula
        if: env.TAP_TOKEN != ''
        run: python scripts/homebrew_formula.py "$GITHUB_REF_NAME" > nimbus.rb
      - name: Enviar para o tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp nimbus.rb tap/Formula/nimbus.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nimbus.rb
          git diff --cached --quiet && exit 0
          git commit -m "nimbus ${GITHUB_REF_NAME#v}"
          git push
