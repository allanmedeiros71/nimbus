[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus"
version = "0.1.0"
description = "Player de terminal que toca em streaming as músicas das suas pastas do Google Drive"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "textual>=0.80",
    "textual-image>=0.8",
    "pillow>=9",
    "mutagen>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nimbus = "nimbus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
