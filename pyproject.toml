[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-player"
dynamic = ["version"]
description = "Terminal player that streams the music in your Google Drive folders"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Allan Medeiros" }]
keywords = ["music", "player", "tui", "google-drive", "mpv"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "textual>=0.80",
    "textual-image>=0.8",
    "pillow>=9",
    "mutagen>=1.45",
]

[project.urls]
Homepage = "https://github.com/allanmedeiros71/nimbus"
Issues = "https://github.com/allanmedeiros71/nimbus/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nimbus = "nimbus.cli:main"

# A versão vem da tag do git (v0.3.1 -> 0.3.1); entre tags vira algo como 0.3.2.dev3.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
